<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Traffic Controller...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgMusic" src="Apocalypse.mp3" loop autoplay></audio>

    <div class="card" id="mainCard">
        <div class="header-text">
            <h1 id="questionText">Is Eve down for a meal at Cjs...</h1>
            <p id="subText">No more go-arounds or redirections, Ma'am 😉😂</p>
        </div>
        
        <div class="btn-container">
            <button id="yesBtn" class="btn">YES</button>
            <button id="noBtn" class="btn">No</button>
        </div>
    </div>

    <div class="success-message" id="successMsg">
        <h1>I knew the corporate baddie would say "YES"😂❤️</h1>
        <p>Okay, now, say that on WhatsApp</p>
        <br>
        <p>And when is the good lady available?<br> "YES" equals a safe landing; You vouch for that, right... 😂</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
