<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healing Wounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgMusic" src="No.mp3" loop autoplay></audio>

    <div class="card" id="mainCard">
        <div class="header-text">
            <h1 id="questionText">Will Resty agree to see me when I come to UG...(Her transport's catered for)</h1>
            <p id="subText">No walking on eggshells again... No KFC bribes 😉😂</p>
        </div>
        
        <div class="btn-container">
            <button id="yesBtn" class="btn">YES</button>
            <button id="noBtn" class="btn">No</button>
        </div>
    </div>

    <div class="success-message" id="successMsg">
        <h1>WOUNDS HEALED!! I knew Resty would say "YES"😂❤️</h1>
        <p>Okay, now, say that on WhatsApp</p>
        <br>
        <p>This is a special edition too!<br> </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
