<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eileen's Eyebrows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgMusic" src="No.mp3" loop autoplay></audio>

    <div class="card" id="mainCard">
        <div class="header-text">
            <h1 id="questionText">Will Eileen let me hear her voice?</h1>
            <p id="subText">Throw in some eyebrows too, as part of the deal 😉😂</p>
        </div>
        
        <div class="btn-container">
            <button id="yesBtn" class="btn">YES</button>
            <button id="noBtn" class="btn">No</button>
        </div>
    </div>

    <div class="success-message" id="successMsg">
        <h1>Throw in some eyebrows in this deal😂❤️</h1>
        <p>Okay, confirm this through an "organised thread" 😉</p>
        <br>
        <p>In<br> </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
